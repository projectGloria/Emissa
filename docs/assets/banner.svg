<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141422"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>

    <!-- Subtle radial glow behind the icon -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- App Icon Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6cff"/>
      <stop offset="100%" stop-color="#5a3fd6"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="180" r="280" fill="url(#glowGrad)"/>
  <circle cx="950" cy="80" r="200" fill="url(#glowGrad)" opacity="0.4"/>

  <!-- Subtle Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="0"/>

  <!-- Left: Official App Icon -->
  <g transform="translate(110, 80)" filter="url(#dropShadow)">
    <rect width="200" height="200" rx="44" fill="url(#iconBg)"/>
    <g transform="translate(46, 46) scale(4.5)">
      <path fill="#ffffff" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" d="M21 3 3 10.5l7 3.5 3.5 7Z"/>
      <path d="M10 14 16 8" fill="none" stroke="#6b4fe6" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(360, 110)">
    <!-- App Name -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist Variable', sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Emissa</text>

    <!-- Tagline -->
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist Variable', sans-serif" font-size="20" font-weight="400">
      Lightweight, resilient desktop YouTube uploader built for creator queues.
    </text>

    <!-- Tech & Feature Badges -->
    <g transform="translate(0, 128)">
      <!-- Badge 1: Tauri 2 + Rust -->
      <g>
        <rect width="112" height="28" rx="14" fill="#202032" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="56" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Tauri 2 · Rust</text>
      </g>
      <!-- Badge 2: React 19 -->
      <g transform="translate(122, 0)">
        <rect width="84" height="28" rx="14" fill="#202032" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="42" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">React 19</text>
      </g>
      <!-- Badge 3: 8 MiB Resumable Chunks -->
      <g transform="translate(216, 0)">
        <rect width="176" height="28" rx="14" fill="#202032" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="88" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">8 MiB Resumable Stream</text>
      </g>
      <!-- Badge 4: Direct Google OAuth -->
      <g transform="translate(402, 0)">
        <rect width="160" height="28" rx="14" fill="#202032" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="80" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Local Credential Vault</text>
      </g>
    </g>
  </g>
</svg>
